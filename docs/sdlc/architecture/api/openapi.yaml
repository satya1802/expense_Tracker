          format: uuid
        amount:
          type: number
        spent_on:
          type: string
          format: date
        note:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - category_id
      - amount
      - spent_on
      - created_at
    budgets:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        monthly_amount:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - category_id
      - monthly_amount
      - created_at
      - updated_at
    alerts:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        period_month:
          type: string
          format: date
        status:
          type: string
        email_sent:
          type: boolean
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
