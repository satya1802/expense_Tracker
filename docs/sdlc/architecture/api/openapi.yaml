components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        currency_code:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - currency_code
      - email_verified
      - created_at
    sessions:
