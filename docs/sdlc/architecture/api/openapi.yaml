          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - token
      - user_id
      - created_at
      - expires_at
    categories:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - is_default
      - created_at
    expenses:
