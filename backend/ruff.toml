line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: T = Depends(...)`; the call in
# the default is how FastAPI resolves it, not the mutable-default bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[format]
quote-style = "double"
